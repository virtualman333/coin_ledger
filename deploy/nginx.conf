# 藏币录 · Nginx 站点配置（独立模式）
# 安装位置：/www/server/panel/vhost/nginx/coin-ledger.conf
# 说明：如果该域名已在宝塔「网站」里登记，install.sh 会改用「片段模式」——
#      即把 nginx-locations.conf 的内容 include 进宝塔生成的站点配置，不再写本文件。

server {
    listen 80;
    listen [::]:80;
    server_name coin.virtualman.top 47.119.132.60;

    access_log /www/wwwlogs/coin-ledger.log;
    error_log  /www/wwwlogs/coin-ledger.error.log;

    root  /www/wwwroot/coin-ledger/public;
    index index.html;
    charset utf-8;

    client_max_body_size 1m;

    # 片段：/api 反代、静态缓存、安全头
    include /www/server/panel/vhost/nginx/coin-ledger.locations.conf;

    # 隐藏文件与备份文件
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|sql|log|tar|gz|zip)$ { deny all; }
}
