# 藏币录管理控制台 · nginx 片段（放在站点的 extension 目录，由主配置自动 include）
#
# 部署位置：/www/server/panel/vhost/nginx/extension/coin.virtualman.top/console.conf
# 构建产物：admin/dist/ 的内容上传到 /www/wwwroot/coin-ledger/public/console/
#
# 设计要点：
#  - ^~ 前缀优先于主配置里的正则 location（.js/.css/.png 缓存规则、敏感文件规则），
#    因此不会截走 /console/assets/*，也不会改动任何前台已有规则。
#  - 全新路径，不与 /admin、/coin/N 等已收录 URL 冲突。
#  - 三重 noindex：页面 meta + X-Robots-Tag + robots.txt Disallow，杜绝被收录。
#  - HTML 不缓存（发版后立即生效），带 hash 的静态资源由浏览器自行协商缓存。

location = /console {
    return 301 /console/;
}

location ^~ /console/ {
    root /www/wwwroot/coin-ledger/public;
    try_files $uri $uri/ /console/index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
