# 藏币录 · Nginx 片段（server 上下文）
# 安装位置：/www/server/panel/vhost/nginx/extension/<域名>/coin-ledger.conf
# 由宝塔站点配置通过 extension 目录 include 进来（面板重新生成配置也不会丢）。

    # ---------- 反爬：限流 + 脚本 UA 拦截 ----------
    limit_req  zone=coin_all burst=60 nodelay;
    limit_conn coin_conn 20;
    limit_req_status 429;
    limit_conn_status 429;
    if ($coin_block) { return 403; }

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- ACME 验证目录放行 ----------
    # 必须留在 HTTP 上：HTTPS 跳转不能盖住它，否则证书续期会绕圈
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # ---------- API 反向代理 ----------
    location ^~ /api/ {
        # 登录口令走明文 HTTP 不可接受，接口一律上 HTTPS
        if ($scheme = http) { return 301 https://$host$request_uri; }

        limit_req zone=coin_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        # API 一律不缓存，避免登录态串号
        add_header Cache-Control "no-store" always;
    }

    # ---------- 静态资源 ----------
    location ^~ /img/ {
        limit_req zone=coin_img burst=60 nodelay;
        # 防盗链：只允许本站页面、直接打开（none）和微信小程序（servicewechat.com），
        # 别的站点引用直接 403。小程序 <image> 会带 servicewechat.com 的 Referer，别漏。
        valid_referers none blocked server_names servicewechat.com *.servicewechat.com;
        if ($invalid_referer) { return 403; }

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 原始数据文件不对外——整站的原料，允许下载等于把库送人
    # 注意用 ^~ ：宝塔主配置里的正则 location（.*\.jpg 等）优先级高于普通前缀匹配
    location ^~ /data/ {
        return 403;
    }

    # 唯一例外：发行清单本身（前端在后端挂掉时要靠它兜底渲染）
    # 精确匹配优先级高于 ^~ 前缀，所以必须单独放行这一条路径
    location = /data/coins.json {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # ---------- 前端路由（真实路径）：交给后端注入页面级 meta ----------
    # /coin/12、/all 这些地址没有实体文件，必须回落到 index.html；由 Node 按路由
    # 写好 title / description / canonical —— 抓取端不跑 JS，只能靠这一层给。
    # 注意不要在 location 里写 add_header，否则上面 server 级的安全头会全部失效。
    location ~ ^/(home|all|series|overview|holdings|cost|account|admin|plan|sitemap|myfeedback)/?$ {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ "^/coin/[0-9]{1,3}/?$" {   # 花括号必须加引号，否则 nginx 当成配置块
        if ($scheme = http) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ---------- 页面主体：强制 HTTPS ----------
    location / {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        try_files $uri $uri/ =404;
    }
