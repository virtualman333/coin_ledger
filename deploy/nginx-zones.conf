# 藏币录 · Nginx 限流/UA 规则（http 上下文）
# 安装位置：/www/server/panel/vhost/nginx/0.coin-ledger.zones.conf
# 文件名以 0. 开头，保证在站点配置之前被 include（zone 必须先定义后引用）

limit_req_zone  $binary_remote_addr zone=coin_all:10m rate=240r/m;
limit_req_zone  $binary_remote_addr zone=coin_api:10m rate=120r/m;
limit_req_zone  $binary_remote_addr zone=coin_img:10m rate=180r/m;
limit_conn_zone $binary_remote_addr zone=coin_conn:10m;

# 本机放行（健康检查、运维脚本）
geo $coin_local {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}

# 自动化脚本 UA
map $http_user_agent $coin_bad_ua {
    default 0;
    ~*(python-requests|python-urllib|scrapy|aiohttp|httpx|wget|libwww|httpclient|java/|go-http-client|okhttp) 1;
}

# 命中脚本 UA 且不是本机 → 拦
map "$coin_bad_ua$coin_local" $coin_block {
    "10" 1;
    default 0;
}
